[project]
name = "car-maintenance-bot"
version = "0.1.0"
description = "Telegram bot that reads a Subaru odometer and reminds you when maintenance is due"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sqlalchemy>=2.0.54",
    "subarulink>=0.7.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
